    <title>Hero Harshit Hub</title>

        // Apply theme immediately to prevent flashing
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.classList.add(`${savedTheme}-theme`);
        }
    </script>
</head>
